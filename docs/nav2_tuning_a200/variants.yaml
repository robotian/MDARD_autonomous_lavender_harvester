# Nav2 variants benchmarked for docs/nav2_tuning_a200.md: each one is merged over the baseline
# (mtu32_bringup config/a200/nav2.yaml as of mtu32_husky 18aaebf) in the param_overrides layout of
# config/nav2_robots.yaml; a new FollowPath or GridBased plugin replaces that whole block (GridBased = the a300's
# SmacPlannerHybrid DUBIN block). Runs: results.json (label a2_<variant>_r<n>, B_j100 as a2_Bj100, B_a300 as
# a2_Ba300; a2_D1_r1 never ran (zenoh wedge), its run is r1b; base = baseline). D2 is the committed config.
B_j100:
  global_costmap:
    global_costmap:
      ros__parameters:
        plugins: [static_layer, inflation_layer]
  local_costmap:
    local_costmap:
      ros__parameters:
        plugins: [static_layer, inflation_layer]
  bt_navigator:
    ros__parameters: {default_nav_through_poses_bt_xml: $(find-pkg-share mtu32_bringup)/config/behavior_trees/navigate_through_poses_replan_if_invalid.xml}
  planner_server:
    ros__parameters:
      GridBased:
        plugin: nav2_smac_planner::SmacPlannerHybrid
        tolerance: 0.1
        downsample_costmap: false
        downsampling_factor: 1
        allow_unknown: true
        max_iterations: -1
        max_on_approach_iterations: 1000
        terminal_checking_interval: 5000
        max_planning_time: 5.0
        motion_model_for_search: DUBIN
        cost_travel_multiplier: 2.0
        angle_quantization_bins: 64
        analytic_expansion_ratio: 3.5
        analytic_expansion_max_length: 3.0
        analytic_expansion_max_cost: 200.0
        analytic_expansion_max_cost_override: false
        minimum_turning_radius: 0.2
        reverse_penalty: 2.1
        change_penalty: 0.12
        non_straight_penalty: 1.2
        cost_penalty: 2.0
        retrospective_penalty: 0.025
        rotation_penalty: 5.0
        lookup_table_size: 20.0
        cache_obstacle_heuristic: true
        allow_reverse_expansion: false
        smooth_path: true
        debug_visualizations: true
        smoother: {max_iterations: 1000, w_smooth: 0.3, w_data: 0.2, tolerance: 1.0e-10, do_refinement: true}
  controller_server:
    ros__parameters:
      general_goal_checker: {xy_goal_tolerance: 0.05, yaw_goal_tolerance: 0.05}
      FollowPath: {plugin: 'nav2_graceful_controller::GracefulController', transform_tolerance: 0.5, min_lookahead: 0.25,
        max_lookahead: 1.0, k_phi: 2.0, k_delta: 1.0, beta: 0.2, lambda: 2.0, v_linear_min: 0.05, v_linear_max: 0.5, v_angular_max: 1.0,
        v_angular_min_in_place: 0.25, slowdown_radius: 0.6, initial_rotation: false, prefer_final_rotation: true, rotation_scaling_factor: 0.5,
        allow_backward: false, in_place_collision_resolution: 0.1}
  velocity_smoother:
    ros__parameters:
      max_velocity: [0.5, 0.0, 1.0]
      min_velocity: [-0.5, 0.0, -1.0]
      max_accel: [1.0, 0.0, 2.0]
      max_decel: [-1.0, 0.0, -2.0]
