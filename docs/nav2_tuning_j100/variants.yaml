# Nav2 variants benchmarked for docs/nav2_tuning_j100.md: each one is merged over the baseline
# (mtu32_bringup config/j100/nav2.yaml as of mtu32_husky b9e0cb3) in the param_overrides layout of
# config/nav2_robots.yaml; `inherit` starts from another variant. Runs: results.json (label -> legs; labels name the
# variant: base = baseline, mppis = mppi_static, final_repo = the committed config, safety = graceful7 against an
# unmapped obstacle). /tmp/nav2tune/ntp_bt.xml = config/behavior_trees/navigate_through_poses_replan_if_invalid.xml.
rpp1:
  controller_server:
    ros__parameters:
      general_goal_checker:
        xy_goal_tolerance: 0.05
        yaw_goal_tolerance: 0.05
      FollowPath:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        desired_linear_vel: 0.5
        lookahead_dist: 0.6
        min_lookahead_dist: 0.3
        max_lookahead_dist: 0.9
        lookahead_time: 1.5
        use_velocity_scaled_lookahead_dist: true
        rotate_to_heading_angular_vel: 0.8
        transform_tolerance: 0.5
        min_approach_linear_velocity: 0.05
        approach_velocity_scaling_dist: 0.6
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        use_regulated_linear_velocity_scaling: true
        use_fixed_curvature_lookahead: false
        use_cost_regulated_linear_velocity_scaling: false
        regulated_linear_scaling_min_radius: 0.9
        regulated_linear_scaling_min_speed: 0.2
        use_rotate_to_heading: true
        allow_reversing: false
        rotate_to_heading_min_angle: 0.785
        max_angular_accel: 2.0
        max_robot_pose_search_dist: 10.0
        interpolate_curvature_after_goal: false
graceful1:
  controller_server:
    ros__parameters:
      general_goal_checker:
        xy_goal_tolerance: 0.05
        yaw_goal_tolerance: 0.05
      FollowPath:
        plugin: nav2_graceful_controller::GracefulController
        transform_tolerance: 0.5
        min_lookahead: 0.25
        max_lookahead: 0.8
        k_phi: 2.0
        k_delta: 1.0
        beta: 0.4
        lambda: 2.0
        v_linear_min: 0.1
        v_linear_max: 0.5
        v_angular_max: 1.0
        v_angular_min_in_place: 0.4
        slowdown_radius: 0.8
        initial_rotation: false
        prefer_final_rotation: true
        rotation_scaling_factor: 0.5
        allow_backward: false
        in_place_collision_resolution: 0.1
mppi_static:
  global_costmap:
    global_costmap:
      ros__parameters: &id001
        plugins:
        - static_layer
        - inflation_layer
rpp2:
  controller_server:
    ros__parameters:
      FollowPath:
        allow_reversing: false
        approach_velocity_scaling_dist: 0.6
        desired_linear_vel: 0.5
        interpolate_curvature_after_goal: false
        lookahead_dist: 0.6
        lookahead_time: 1.5
        max_allowed_time_to_collision_up_to_carrot: 1.0
        max_angular_accel: 2.0
        max_lookahead_dist: 0.9
        max_robot_pose_search_dist: 10.0
        min_approach_linear_velocity: 0.05
        min_lookahead_dist: 0.3
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        regulated_linear_scaling_min_radius: 0.9
        regulated_linear_scaling_min_speed: 0.2
        rotate_to_heading_angular_vel: 0.8
        rotate_to_heading_min_angle: 0.785
        transform_tolerance: 0.5
        use_collision_detection: false
        use_cost_regulated_linear_velocity_scaling: false
        use_fixed_curvature_lookahead: false
        use_regulated_linear_velocity_scaling: true
        use_rotate_to_heading: true
        use_velocity_scaled_lookahead_dist: true
      general_goal_checker:
        xy_goal_tolerance: 0.05
        yaw_goal_tolerance: 0.05
  global_costmap:
    global_costmap:
      ros__parameters: *id001
mppi_t1:
  inherit: mppi_static
  controller_server:
    ros__parameters:
      general_goal_checker:
        xy_goal_tolerance: 0.05
        yaw_goal_tolerance: 0.05
mppi_t2:
  inherit: mppi_t1
  controller_server:
    ros__parameters:
      FollowPath:
        PathFollowCritic:
          cost_weight: 12.0
        PathAlignCritic:
          cost_weight: 14.0
mppi_t3:
  inherit: mppi_t2
  controller_server:
    ros__parameters:
      FollowPath:
        PathFollowCritic:
          offset_from_furthest: 12
          threshold_to_consider: 1.0
        GoalCritic:
          threshold_to_consider: 1.0
        GoalAngleCritic:
          threshold_to_consider: 0.5
bt_replan_if_invalid:
  bt_navigator:
    ros__parameters:
      default_nav_through_poses_bt_xml: /tmp/nav2tune/ntp_bt.xml
rpp3:
  inherit: rpp2
  bt_navigator:
    ros__parameters:
      default_nav_through_poses_bt_xml: /tmp/nav2tune/ntp_bt.xml
  controller_server:
    ros__parameters:
      FollowPath:
        rotate_to_heading_angular_vel: 0.6
        max_angular_accel: 1.5
mppi_g1:
  inherit: mppi_t1
  bt_navigator:
    ros__parameters:
      default_nav_through_poses_bt_xml: /tmp/nav2tune/ntp_bt.xml
  controller_server:
    ros__parameters:
      FollowPath:
        PathFollowCritic:
          threshold_to_consider: 1.0
        GoalCritic:
          threshold_to_consider: 1.0
        GoalAngleCritic:
          threshold_to_consider: 0.5
farm_static:
  bt_navigator:
    ros__parameters:
      default_nav_through_poses_bt_xml: /tmp/nav2tune/ntp_bt.xml
  global_costmap:
    global_costmap:
      ros__parameters:
        plugins:
        - static_layer
        - inflation_layer
  local_costmap:
    local_costmap:
      ros__parameters:
        plugins:
        - static_layer
        - inflation_layer
  controller_server:
    ros__parameters:
      general_goal_checker:
        xy_goal_tolerance: 0.05
        yaw_goal_tolerance: 0.05
graceful2:
  inherit: farm_static
  controller_server:
    ros__parameters:
      FollowPath:
        plugin: nav2_graceful_controller::GracefulController
        transform_tolerance: 0.5
        min_lookahead: 0.25
        max_lookahead: 0.8
        k_phi: 2.0
        k_delta: 1.0
        beta: 0.4
        lambda: 2.0
        v_linear_min: 0.05
        v_linear_max: 0.5
        v_angular_max: 1.0
        v_angular_min_in_place: 0.4
        slowdown_radius: 0.8
        initial_rotation: false
        prefer_final_rotation: true
        rotation_scaling_factor: 0.5
        allow_backward: false
        in_place_collision_resolution: 0.1
rpp4:
  inherit: farm_static
  controller_server:
    ros__parameters:
      FollowPath:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        desired_linear_vel: 0.5
        lookahead_dist: 0.6
        min_lookahead_dist: 0.15
        max_lookahead_dist: 0.9
        lookahead_time: 1.5
        use_velocity_scaled_lookahead_dist: true
        rotate_to_heading_angular_vel: 0.6
        transform_tolerance: 0.5
        min_approach_linear_velocity: 0.05
        approach_velocity_scaling_dist: 0.6
        use_collision_detection: true
        max_allowed_time_to_collision_up_to_carrot: 1.0
        use_regulated_linear_velocity_scaling: true
        use_fixed_curvature_lookahead: false
        use_cost_regulated_linear_velocity_scaling: false
        regulated_linear_scaling_min_radius: 0.9
        regulated_linear_scaling_min_speed: 0.2
        use_rotate_to_heading: true
        allow_reversing: false
        rotate_to_heading_min_angle: 0.785
        max_angular_accel: 1.5
        max_robot_pose_search_dist: 10.0
        interpolate_curvature_after_goal: false
graceful3:
  inherit: graceful2
  controller_server:
    ros__parameters:
      FollowPath:
        prefer_final_rotation: false
graceful4:
  inherit: graceful3
  controller_server:
    ros__parameters:
      FollowPath:
        allow_backward: true
graceful5:
  inherit: graceful2
  controller_server:
    ros__parameters:
      FollowPath:
        beta: 0.2
        max_lookahead: 1.0
        slowdown_radius: 0.6
        v_angular_min_in_place: 0.25
graceful6:
  inherit: graceful5
  controller_server:
    ros__parameters:
      general_goal_checker:
        yaw_goal_tolerance: 0.087
graceful7:
  inherit: graceful5
  velocity_smoother:
    ros__parameters:
      max_accel: [1.0, 0.0, 2.0]
      max_decel: [-1.0, 0.0, -2.0]
