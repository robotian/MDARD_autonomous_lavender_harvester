# Nav2 variants for docs/nav2_tuning_j100.md, section "Retune 2026-10-14": merged over mtu32_bringup config/j100/nav2.yaml
# as of mtu32_husky 1106864 (the 2026-10-13 Graceful set). Runs: retune_2026-10-14_results.json (jb_<variant>_r<n>; base = that set;
# jb_J2_r1 never started (stack not up), its run is r1b). J6 is the committed config.
J1:
  controller_server:
    ros__parameters:
      general_goal_checker: {xy_goal_tolerance: 0.1, yaw_goal_tolerance: 0.1}
J2:
  controller_server:
    ros__parameters:
      FollowPath: {min_lookahead: 0.4, max_lookahead: 2.0}
J3:
  controller_server:
    ros__parameters:
      FollowPath: {v_linear_min: 0.1}
J6:
  controller_server:
    ros__parameters:
      FollowPath: {v_linear_min: 0.1}
  planner_server:
    ros__parameters:
      GridBased: {minimum_turning_radius: 0.4}
